base:
  data_path: ../data
  ihc_type: CD3CD20
  mapping_file: ../../../ihc_mapping.json
  mask_extension: .gpkg
  remote_path: /media/AprioricsSlides
  seed: 42
  slide_extension: .svs
  split_file: ../../../splits.csv
evaluate:
  area_threshold: 100
  flood_mask: false
  iou_threshold: 0.5
  test_fold: test
local:
  evaluate_path: evaluate
  geojson_path: gt_geojsons
  hovernet_path: hoverfast_gpkgs
  mask_path: gt_gpkgs
  reg_path: registration_geojsons
  slide_path: slides
  train_path: train
patches:
  export_geojson: true
  filter_pos: 0
  level: 0
  overlap: 0.1
  overwrite: true
  patch_size: 256
remote:
  evaluate_path: evaluate
  geojson_path: gt_geojsons
  mask_path: gt_gpkgs
  slide_path: .
  train_path: train
slide_download:
  add_tree: true
  clean_previous: true
  import_file: ../../../file_lists/CD3CD20
  import_ihc: false
train:
  batch_size: 32
  data_type: segmentation
  epochs: 5
  fold: 0
  gpu: 0
  level: 0
  loss: wbce_10
  lr: 1e-4
  model: dpt/tu-hf-hub:paige-ai/Virchow2
  num_workers: 32
  p_pos: 0.9
  patch_size: 224
  scheduler: one-cycle
  transforms: hovernet
  wd: 0.1
